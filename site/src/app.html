<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<!-- 禁用浏览器自动翻译 -->
		<meta name="google" content="notranslate" />
		<meta name="googlebot" content="notranslate" />
		<meta http-equiv="Content-Language" content="zh-CN, en-US" />

		<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
		<link rel="manifest" href="/favicon/site.webmanifest" />
		<link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#5bbad5" />
		<meta name="msapplication-TileColor" content="#224679" />
		<meta name="msapplication-TileImage" content="/favicon/mstile-144x144.png" />
		<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#ffffff" />
		<meta name="color-scheme" content="light dark" />
		<script>
			(function () {
				try {
					const saved = localStorage.getItem('theme');
					if (saved === 'light' || saved === 'dark') {
						document.querySelector('meta[name="color-scheme"]').content = saved;
						const themeColor = document.querySelector('meta[name="theme-color"]');
						themeColor.content = saved === 'dark' ? '#000000' : '#ffffff';
						themeColor.media = 'all';
					}
				} catch {
					// 存储受限时，首屏沿用系统配色。
				}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div id="sveltekit-body" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
