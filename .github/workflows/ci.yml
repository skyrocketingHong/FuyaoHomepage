name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run audit:privacy
      - name: theme-contract copy drift check
        run: npm run contracts:check
      - run: npm run check --workspace site
      - run: npm run lint
      - run: npm test --workspace site
      - run: npm run build --workspace site
